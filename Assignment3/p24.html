<!DOCTYPE html>
<html>
<head>
    <title>Alphabet Validation</title>
</head>
<body>

    <h2>Alphabet Validation</h2>

    <input type="text" id="text" placeholder="Enter a string">
    <button onclick="validateText()">Validate</button>

    <p id="result"></p>

    <script>
        function validateText() {
            let text = document.getElementById("text").value;
            let pattern = /^[A-Za-z]+$/;

            if (pattern.test(text)) {
                document.getElementById("result").innerHTML = "The string contains only alphabets.";
            } else {
                document.getElementById("result").innerHTML = "The string does not contain only alphabets.";
            }
        }
    </script>

</body>
</html>
