<!DOCTYPE html>
<html>
<head>
    <title>Keydown Event</title>
</head>
<body>

    <h2>Keydown Event</h2>

    <input type="text" id="input" placeholder="Press any key">

    <p id="message"></p>

    <script>
        document.getElementById("input").addEventListener("keydown", function() {
            document.getElementById("message").innerHTML =
                "A key was pressed!";
        });
    </script>

</body>
</html>
