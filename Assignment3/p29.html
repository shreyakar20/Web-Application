<!DOCTYPE html>
<html>
<head>
    <title>Form Validation</title>
</head>
<body>

    <h2>Form Validation</h2>

    <form>
        <label>Name:</label>
        <input type="text" id="name"><br><br>

        <label>Email:</label>
        <input type="text" id="email"><br><br>

        <label>Mobile Number:</label>
        <input type="text" id="mobile"><br><br>

        <label>PIN Code:</label>
        <input type="text" id="pin"><br><br>

        <button type="button" onclick="validateForm()">Submit</button>
    </form>

    <p id="result"></p>

    <script>
        function validateForm() {
            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let mobile = document.getElementById("mobile").value;
            let pin = document.getElementById("pin").value;

            let namePattern = /^[A-Za-z ]+$/;
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            let mobilePattern = /^[0-9]{10}$/;
            let pinPattern = /^[0-9]{6}$/;

            if (!namePattern.test(name)) {
                document.getElementById("result").innerHTML = "Invalid Name";
            }
            else if (!emailPattern.test(email)) {
                document.getElementById("result").innerHTML = "Invalid Email";
            }
            else if (!mobilePattern.test(mobile)) {
                document.getElementById("result").innerHTML = "Invalid Mobile Number";
            }
            else if (!pinPattern.test(pin)) {
                document.getElementById("result").innerHTML = "Invalid PIN Code";
            }
            else {
                document.getElementById("result").innerHTML =
                    "Form Submitted Successfully!";
            }
        }
    </script>

</body>
</html>
