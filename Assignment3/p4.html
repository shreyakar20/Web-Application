<!DOCTYPE html>
<html>
<head>
    <title>Temperature Conversion</title>
</head>
<body>

    <h2>Temperature Conversion</h2>

    <script>
        function celsiusToFahrenheit(celsius) {
            return (celsius * 9 / 5) + 32;
        }
        function fahrenheitToCelsius(fahrenheit) {
            return (fahrenheit - 32) * 5 / 9;
        }
        let celsius = Number(prompt("Enter temperature in Celsius:"));
        let fahrenheit = Number(prompt("Enter temperature in Fahrenheit:"));

        document.write("Celsius: " + celsius + " °C<br>");
        document.write("Celsius to Fahrenheit: " + celsiusToFahrenheit(celsius) + " °F<br><br>");

        document.write("Fahrenheit: " + fahrenheit + " °F<br>");
        document.write("Fahrenheit to Celsius: " + fahrenheitToCelsius(fahrenheit) + " °C");
    </script>

</body>
</html>
