<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS DATA TYPES</title>
</head>
<body>
    <h2>JS variables of different datatypes</h2>
    <script>
        let name = "Shreya";
        let age = 20;
        let isStudent = true;
        let value =null;
        let address;
        let fruits = ["Apple", "Mango", "Banana"];
        let student = {
            course : "CSE",
            year : 3
        };
        document.write("String: " + name + "<br>");
        document.write("Number: " + age + "<br>");
        document.write("Boolean: " + isStudent + "<br>");
        document.write("Null: " + value + "<br>");
        document.write("Undefined: " + address + "<br>");
        document.write("Array: " + fruits.join(", ") + "<br>");
        document.write("Object: Course = " + student.course + ", Year = " + student.year);
    </script>
</body>
</html>
