<!DOCTYPE html>
<html>
<head>
    <title>Student Result</title>
</head>
<body>

    <h2>Student Result</h2>

    <script>
        function calculateTotal(m1, m2, m3, m4, m5) {
            return m1 + m2 + m3 + m4 + m5;
        }

        function calculateAverage(total) {
            return total / 5;
        }

        function calculatePercentage(total) {
            return (total / 500) * 100;
        }

        function calculateGrade(percentage) {
            if (percentage >= 90) {
                return "A+";
            } else if (percentage >= 80) {
                return "A";
            } else if (percentage >= 70) {
                return "B";
            } else if (percentage >= 60) {
                return "C";
            } else if (percentage >= 50) {
                return "D";
            } else {
                return "F";
            }
        }

        let m1 = Number(prompt("Enter marks for Subject 1:"));
        let m2 = Number(prompt("Enter marks for Subject 2:"));
        let m3 = Number(prompt("Enter marks for Subject 3:"));
        let m4 = Number(prompt("Enter marks for Subject 4:"));
        let m5 = Number(prompt("Enter marks for Subject 5:"));

        let total = calculateTotal(m1, m2, m3, m4, m5);
        let average = calculateAverage(total);
        let percentage = calculatePercentage(total);
        let grade = calculateGrade(percentage);

        document.write("Total Marks: " + total + " / 500<br>");
        document.write("Average: " + average + "<br>");
        document.write("Percentage: " + percentage + "%<br>");
        document.write("Grade: " + grade);
    </script>

</body>
</html>
