<!DOCTYPE html>
<html>
<head>
    <title>Arithmetic Operations</title>
</head>
<body>

    <h2>Arithmetic Operations Using Functions</h2>

    <script>
        function add(a, b) {
            return a + b;
        }
        function subtract(a, b) {
            return a - b;
        }
        function multiply(a, b) {
            return a * b;
        }
        function divide(a, b) {
            return a / b;
        }
        function modulus(a, b) {
            return a % b;
        }
        let num1 = 20;
        let num2 = 6;
        document.write("First Number: " + num1 + "<br>");
        document.write("Second Number: " + num2 + "<br><br>");

        document.write("Addition: " + add(num1, num2) + "<br>");
        document.write("Subtraction: " + subtract(num1, num2) + "<br>");
        document.write("Multiplication: " + multiply(num1, num2) + "<br>");
        document.write("Division: " + divide(num1, num2) + "<br>");
        document.write("Modulus: " + modulus(num1, num2) + "<br>");
    </script>

</body>
</html>
