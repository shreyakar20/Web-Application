<!DOCTYPE html>
<html>
<head>
    <title>Sum of Natural Numbers</title>
</head>
<body>

    <h2>Sum of First N Natural Numbers</h2>

    <script>
        let n = Number(prompt("Enter the value of N:"));
        let sum = 0;

        for (let i = 1; i <= n; i++) {
            sum = sum + i;
        }

        document.write("N = " + n + "<br>");
        document.write("Sum = " + sum);
    </script>

</body>
</html>
