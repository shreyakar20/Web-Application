<!DOCTYPE html>
<html>
<head>
    <title>Reverse a Number</title>
</head>
<body>

    <h2>Reverse the Digits of a Number</h2>

    <script>
        let number = Number(prompt("Enter a number:"));
        let reverse = 0;

        while (number > 0) {
            let digit = number % 10;
            reverse = reverse * 10 + digit;
            number = Math.floor(number / 10);
        }

        document.write("Reverse of the number: " + reverse);
    </script>

</body>
</html>
