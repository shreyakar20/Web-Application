<!DOCTYPE html>
<html>
<head>
    <title>Multiplication Table</title>
</head>
<body>

    <h2>Multiplication Table</h2>

    <script>
        let number = Number(prompt("Enter a number:"));
        document.write("Multiplication Table of " + number + "<br><br>");

        for (let i = 1; i <= 10; i++) {
            document.write(number + " × " + i + " = " + (number * i) + "<br>");
        }
    </script>

</body>
</html>
